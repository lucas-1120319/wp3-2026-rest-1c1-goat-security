{% extends 'index.html' %}
{% block header %}
    {% block title %}
        {{ learning_title["name"]}}
    {% endblock %}
{% endblock %}

{% block content%}
        <label for="filter_keywords">Filter op de onderwerpen</label>
    <input onkeyup="filterStatus()"  type="text"  name="filter_keywords" id="filter_keywords" >
    <div class="mb-3">
         <strong>Groepsgemiddelde:</strong>
        <span class="badge bg-danger">Onder</span>
        <span class="badge bg-warning">Gelijk</span>
        <span class="badge bg-success">Boven</span>
    </div>
<div class="row" id="learningGoals_container">

</div>

<script>
filterStatus()
    function filterStatus(){
        const filter_keywords = document.getElementById("filter_keywords").value;
        const subject_id = {{ subject_id }}
        fetch(`/student/subject/learning_goals/filter_average?filter_keywords=${filter_keywords}&subject_id=${subject_id}`)
        .then(response => response.json())
        .then(data => {
            update_cards(data);
        });

    }
function update_cards(learning_goals){

    learningGoals_container = document.getElementById("learningGoals_container");
    avg_badge = document.getElementById("avg_badge");
    learningGoals_container.innerHTML = "";  // clear current cards

    learning_goals.forEach(goal => {
        let student_avg = parseFloat(goal.student_avg);
        let group_avg = parseFloat(goal.group_avg);
        const margin_avg = 0.1;

        let scoreColor;
        let toolTip_Text;
        if ((student_avg + margin_avg) > group_avg && (student_avg - margin_avg) < group_avg) {
             scoreColor = "warning";
             toolTip_Text = "Gelijk met groepsgenoten";
        } else if ((student_avg + margin_avg) < group_avg) {
              scoreColor = "success";
              toolTip_Text = "Boven groepsgemiddelde";
        } else {
            scoreColor = "danger";
            toolTip_Text = "Onder groepsgemiddelde";
        }

        const badges_html = goal.keywords.map(keyword =>
                    `<span class="badge text-bg-primary">${keyword.name}</span>`
                ).join(' ');



        const card_html = `
        <div class="col-md-4">
            <div class="card">
                <a class="link-dark link-underline link-underline-opacity-0" href="/student/subject/learning_goals/${goal.id}/examlist">
                    <div class="card-body column ">

                        <div class="fs-3 fw-bold " >${goal.title}</div>
                        <span class="badge bg-${scoreColor}">${toolTip_Text}</span>
                        <div>
                         ${badges_html}
                        </div>
                    </div>
                </a>
            </div>
        </div>
        `;
        learningGoals_container.innerHTML += card_html;
    });
}
</script>
{% endblock %}
