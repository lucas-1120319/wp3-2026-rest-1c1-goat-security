    <title>Register</title>

    <style>

        html, body{
        height: 100%;
        }

        main{
            display: flex;
            height: 100%;
            align-items: center;
            justify-content: center;
        }

        form {
            width: 100%;
            margin: auto;
            max-width: 24rem;
        }

    </style>

<body>
    <main>
        <form method="post" class="m-4">
                <h1 class="text-center mb-4">Login</h1>
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control mb-3" id="email" name="email" placeholder="name@example.com">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control mb-3" id="password" name="password" placeholder="Your password...">
                    <label for="password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control mb-3" id="confirm_password" name="confirm_password" placeholder="Confirm Your password...">
                <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </main>
