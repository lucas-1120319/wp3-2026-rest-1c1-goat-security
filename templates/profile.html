{% extends 'index.html' %}
{% block header %}
    {% block title %}
        Profiel
    {% endblock %}
{% endblock %}

{% block content %}
<form method="POST"  class="row g-3">
    <div class="col-md-6">
        <label for="first_nameInput" class="form-label">Voornaam:</label>
        <input type="text" class="form-control" id="first_nameInput" name="first_name" value="{{ user.first_name or '' }}" required>
    </div>
    <div class="col-md-6">
        <label for="last_nameInput" class="form-label">Achternaam:</label>
        <input type="text" class="form-control" id="last_nameInput" name="last_name" value="{{ user.last_name or ''}}" required>
    </div>
    <div class="col-md-12">

        <label for="emailInput" class="form-label">Emailadres:</label>
        <input type="email" class="form-control" id="emailInput" name="email" aria-describedby="emailHelp" value="{{ user.email or '' }}" required>

    </div>
    <div class="col-md-12">
        <label for="passwordInput" class="form-label">Wachtwoord</label>
        <input type="password" class="form-control" id="passwordInput" name="password" >
    </div>
    <div class="col-md-6">
        <label for="phoneInput" class="form-label">Telefoonnummer:</label>
        <input type="tel" class="form-control" id="phoneInput" name="phone" value="{{ user.phone or '' }}" required>
    </div>
    <div class="col-md-6">
        <label for="birth_dateInput" class="form-label">Geboorte datum:</label>
        <input type="date" class="form-control" id="birth_dateInput" name="birth_date" value="{{ user.birth_date or '' }}" required>
    </div>


    <div class="col-12">
        <button type="submit" class="btn btn-primary">Opslaan</button>
    </div>
</form>
{% endblock %}
