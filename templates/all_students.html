{% extends 'index.html' %}
{% block header %}
    {% block title %}
        Studenten
    {% endblock %}
{% endblock %}

{% block content%}
<div class="row">

    {%for student in students %}
        <div class="col-md-4">
            <div class="card  " >
                <a class="link-underline link-underline-opacity-0  " href="#">
                  <div class="card-body">
                    <div class="fs-3">Student {{ student["first_name"] }}</div>
                  </div>
                </a>
            </div>
        </div>

    {% else %}
        <h2 class="fs-3">Geen studenten in deze klass</h2>
    {%endfor%}
</div>
{% endblock %}
